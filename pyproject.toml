[project]
name = "bulk-certificate-generator"
version = "0.1.0"
description = "Production-grade asynchronous Bulk Certificate Generator API in FastAPI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Maneesh", email = "manish@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "reportlab>=4.2.5",
    "qrcode>=8.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
